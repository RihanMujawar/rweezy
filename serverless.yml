service: rweezy

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  httpApi:
    cors: true

functions:
  api:
    handler: backend/server.handler
    events:
      - httpApi:
          path: /api/{proxy+}
          method: '*'
    environment:
      DATABASE_URL: ${env:DATABASE_URL}
      JWT_SECRET: ${env:JWT_SECRET}
      MAPBOX_ACCESS_TOKEN: ${env:MAPBOX_ACCESS_TOKEN}
      FCM_SERVER_KEY: ${env:FCM_SERVER_KEY}
      TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${env:TWILIO_VERIFY_SERVICE_SID}
      PHONE_VERIFICATION_SECRET: ${env:PHONE_VERIFICATION_SECRET}
      EMAIL_OTP_SECRET: ${env:EMAIL_OTP_SECRET}

plugins:
  - serverless-s3-sync

custom:
  s3Sync:
    - bucketName: rweezy-frontend-${sls:stage}
      localDir: frontend/dist/client

resources:
  Resources:
    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: rweezy-frontend-${sls:stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetter
              Effect: Allow
              Principal: "*"
              Action: "s3:GetObject"
              Resource: !Join ["", ["arn:aws:s3:::", !Ref FrontendBucket, "/*"]]

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - Id: FrontendS3
              DomainName: !GetAtt FrontendBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: BackendApi
              DomainName: !Join ["", [!Ref HttpApi, ".execute-api.", "${aws:region}", ".amazonaws.com"]]
              CustomOriginConfig:
                ProtocolPolicy: https-only
          Enabled: true
          DefaultRootObject: index.html
          DefaultCacheBehavior:
            TargetOriginId: FrontendS3
            ViewerProtocolPolicy: redirect-to-https
            ForwardedValues:
              QueryString: false
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: BackendApi
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - DELETE
                - GET
                - HEAD
                - OPTIONS
                - PATCH
                - POST
                - PUT
              ForwardedValues:
                QueryString: true
                Headers:
                  - Authorization
                  - Cookie
                Cookies:
                  Forward: all
              MinTTL: 0
              DefaultTTL: 0
              MaxTTL: 0
