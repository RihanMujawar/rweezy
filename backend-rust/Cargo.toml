[package]
name = "backend-rust"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
actix-rt = "2"
actix-cors = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "rust_decimal", "json", "macros", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9"
bcrypt = "0.15"
argon2 = "0.5"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.35", features = ["serde-float"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.18", features = ["derive"] }
time = "0.3"
prometheus = "0.13"
utoipa = { version = "4", features = ["actix_extras", "uuid", "chrono", "decimal"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
